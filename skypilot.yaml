resources:
  cloud: gcp
  cpus: 1+
  memory: 4+
  autostop:
    idle_minutes: 2
    hook: |
      echo "Running post hook."
    hook_timeout: 7200  # 2 hours in seconds

workdir:
  url: https://github.com/aftershootco/booksort.git
  ref: main

name: booksort-train

setup: |
  printenv
  which python
  which uv
  which pip

# Typical use: make use of resources, such as running training.
# Invoked under the workdir (i.e., can use its files).
run: |
  bash ./run.sh
