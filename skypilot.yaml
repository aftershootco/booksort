resources:
  image_id: projects/aftershoot-stage/global/images/skypilot-base-image
  cloud: gcp
  cpus: 2+
  memory: 8+
  autostop:
    idle_minutes: 1
    down: true

workdir:
  url: https://github.com/aftershootco/booksort.git
  ref: main

name: booksort-train

setup: |
  printenv
  which python
  which uv
  which pip

# Typical use: make use of resources, such as running training.
# Invoked under the workdir (i.e., can use its files).
run: |
  bash ./run.sh
